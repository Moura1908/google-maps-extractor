<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <title>Maps Scraper</title>
    <link href="css/style.css" rel="stylesheet" />
</head>

<body>
    <div id="maincontent" style="width: 100%">
        <div id="content">
            <h2 style="text-align: left; margin-bottom: 4px;">Maps Scraper</h2>
            <p id="leadcount" style="margin: 0 0 12px; color: #666; font-size: 13px;"></p>

            <div style="display: flex; flex-direction: column; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid #e5e5e5;">
                <input type="text" id="profileid" placeholder="ex.: clínicas de estética em Brasília"
                    value="coffee shop near new york"
                    style="height: 20px; width: 300px; border-radius: 0.375rem; border: 1px #ccc solid; padding: 10px;" />
                <button id="addprofilebtn"
                    style="width: 200px; height: 40px; background-color: darkgreen; color: #fff; border: none; border-radius: 0.375rem; cursor: pointer;">
                    Buscar no Google Maps
                </button>
            </div>

            <div style="display: flex; gap: 10px; padding-top: 16px;">
                <button id="opendashboard"
                    style="height: 36px; padding: 0 16px; border-radius: 0.375rem; border: 1px solid #ccc; background: #fff; cursor: pointer;">
                    Abrir dashboard
                </button>
            </div>
        </div>
    </div>
</body>
<script src="js/popup.js"></script>

</html>
